[alembic]
# Directorio donde viven las migraciones
script_location = alembic

# Agregar el proyecto al sys.path para poder importar app.*
prepend_sys_path = .

# Separador de versiones (os usa el separador del sistema operativo)
version_path_separator = os

# La URL se sobreescribe en env.py desde app.config
sqlalchemy.url =

[post_write_hooks]
# Sin hooks post-escritura por ahora

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
